server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Everything the API owns. No trailing slash on proxy_pass: the path is forwarded
    # unchanged, because the backend already serves these paths under /api/v1. No route
    # of the SPA starts with /api, so this never shadows a page.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build assets carry a content hash in their name, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # react-router owns the URLs, so any unknown path has to fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
